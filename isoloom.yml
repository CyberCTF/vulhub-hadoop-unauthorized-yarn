# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Hadoop YARN unauthenticated RCE (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's hadoop/unauthorized-yarn, vendored in app/: four machines from the published image
# vulhub/hadoop:2.8.1, with the settings and commands of Vulhub's compose file baked in (build/).
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-hadoop-unauthorized-yarn

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.251.0/24, internet: false}

machines:
  namenode:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 768}
    ports:
      hdfs:
        port: 8020
      namenode-web:
        port: 50070
        protocol: http
        publish: true
    app:
      build: build/namenode
  datanode:
    networks: {lab: 21}
    resources: {cpus: 1, memory_mb: 768}
    depends_on: [namenode]
    ports:
      data:
        port: 50010
      datanode-web:
        port: 50075
    app:
      build: build/datanode
  resourcemanager:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 1024}
    depends_on: [namenode]
    ports:
      web:
        port: 8088
        protocol: http
        publish: true
      rm-rpc:
        port: 8032
    app:
      build: build/resourcemanager
  nodemanager:
    networks: {lab: 11}
    resources: {cpus: 1, memory_mb: 1024}
    depends_on: [resourcemanager]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      nodemanager-web:
        port: 8042
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/nodemanager

checks:
  - name: the ResourceManager answers
    http: http://resourcemanager:8088/cluster
    wait: 300
  - name: the REST API is Hadoop 2.8.1 and has a NodeManager
    script: checks/cluster.sh
    wait: 300

message: |
  A Hadoop 2.8.1 YARN ResourceManager answers at {{ machines.resourcemanager.ports.web.url }}cluster.
  Its REST API, under /ws/v1/cluster/apps, takes new applications from anyone.
